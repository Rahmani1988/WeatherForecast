name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run_tests:
    name: Run Unit and UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Create local.properties for API Key
        run: echo "API_KEY=${{ secrets.API_KEY }}" > local.properties

      # ------------------------------------
      # 1. Run Unit Tests for BOTH modules
      # ------------------------------------
      - name: Run Unit Tests (Mobile & Wear)
        run: ./gradlew testDebugUnitTest

      # ------------------------------------
      # 2. Run UI Tests (Mobile only)
      # ------------------------------------
      - name: Run UI Tests with Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-boot-timeout: 600
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Test Reports (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/'

  build_apks:
    name: Build APKs and AAB
    runs-on: ubuntu-latest
    needs: run_tests

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Create local.properties for API Key
        run: echo "API_KEY=${{ secrets.API_KEY }}" > local.properties

      # ------------------------------------
      # 3. Build everything (This generates APKs for both modules)
      # ------------------------------------
      - name: Build All Variants
        run: ./gradlew assembleDebug assembleRelease

      # ------------------------------------
      # 4. Upload Mobile Artifacts
      # ------------------------------------
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-weather-apks
          path: app/build/outputs/apk/*/app-*.apk

      # ------------------------------------
      # 5. Upload Wear OS Artifacts
      # ------------------------------------
      - name: Upload Wear OS APKs
        uses: actions/upload-artifact@v4
        with:
          name: wear-weather-apks
          path: wear/build/outputs/apk/*/wear-*.apk

      # ------------------------------------
      # 6. Upload Release AABs (For Play Store Upload)
      # ------------------------------------
      - name: Build & Upload Release Bundles (AAB)
        run: ./gradlew bundleRelease

      - name: Upload Release Bundles
        uses: actions/upload-artifact@v4
        with:
          name: release-app-bundles
          path: |
              app/build/outputs/bundle/release/*.aab
              wear/build/outputs/bundle/release/*.aab

